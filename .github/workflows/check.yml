name: Site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/build.py
      - name: Verify committed pages match source
        run: git diff --exit-code -- '*.html' sitemap.xml data/tokens.json
  indexnow:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Give GitHub Pages time to publish this commit
        run: sleep 120
      - name: Tell IndexNow engines the sitemap URLs changed
        run: python3 tools/indexnow.py
